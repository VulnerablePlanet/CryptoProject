<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Technical trading analysis and crypto market anomaly detection." />
    <meta name="theme-color" content="#101922" />
    <title>Crypto market anomaly detector</title>

    <!-- Fonts: preconnect + parallel fetch (previously chained through CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Icons: only the axes the UI uses (opsz 24, wght 400, FILL 0..1): 1113 KB → 452 KB.
         display=block avoids flashing ligature names ("dashboard", "menu"…) as text. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
