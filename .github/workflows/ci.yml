name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Real MongoDB (in-memory replica set + standalone): ledger atomicity,
      # concurrency and agent state persistence
      - name: Run integration tests
        run: npm run test:integration

      - name: Build frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: crypto-anomaly-detector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not enough: the image must start, become ready, serve the
      # SPA and shut down cleanly. (A production-only startup crash shipped
      # unnoticed because this job never ran the image.)
      - name: Smoke test the image
        run: |
          docker run -d --name app --network host \
            -e PORT=5000 \
            -e CORS_ORIGIN=http://localhost:5000 \
            -e JWT_SECRET=ci-smoke-secret-0123456789abcdef0123456789 \
            -e MONGODB_URI_PROD=mongodb://localhost:27017/smoke \
            crypto-anomaly-detector:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:5000/api/health/ready
          curl -fsS http://localhost:5000/ | grep -q '<div id="app">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/api/does-not-exist)" = "404"
          docker stop --time 15 app
          test "$(docker inspect app --format '{{.State.ExitCode}}')" = "0"

      - name: Container logs
        if: always()
        run: docker logs app || true
