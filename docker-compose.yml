version: '3.8'

services:
  # ============================================================================
  # MongoDB
  # ============================================================================
  mongo:
    image: mongo:7
    container_name: crypto-mongo
    restart: unless-stopped
    # Single-node replica set: required for multi-document transactions
    # (portfolio ledger writes are transactional).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: crypto-analyzer
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports its health
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s

  # ============================================================================
  # Application Backend + Frontend
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: crypto-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # The SPA is served by this same container, so its origin is the default
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      MONGODB_URI_PROD: mongodb://mongo:27017/crypto-analyzer?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      BINANCE_MODE: sandbox
      UPLOADS_DIR: /app/uploads
    env_file:
      - .env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health/ready', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
  uploads-data:
